name: CI

# Runs only when a change could actually affect lint/type-check/tests:
#
# - Pull requests into main, skipping ones that touch only files no CI job
#   reads (paths-ignore below). Squash-merging an already-checked PR does NOT
#   re-run CI on main -- it would repeat the exact checks the PR just passed.
# - Release tags (v*), which also build the package.
# - Manual runs (Actions tab -> CI -> Run workflow), which also build.
#
# Keep results/** and dashboard/data/** OUT of paths-ignore: tests read the
# committed CSVs/.npz there (tests/test_dashboard_*.py). Only docs, Markdown,
# and the JS frontend (dashboard-web/, which no CI job checks) are ignored.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "dashboard-web/**"
      - ".gitignore"
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Draft PRs are skipped; marking one "ready for review" triggers the run.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov=weavr --cov-report=xml --cov-report=term --junitxml=junit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml
          retention-days: 14

  build:
    # Nothing consumes the built wheel on an ordinary PR, so only build it
    # when it's actually wanted: a release tag or a manual run.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weavr-dist
          path: dist/*
          retention-days: 30
