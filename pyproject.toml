[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weavr"
version = "0.1.0"
description = "Hybrid AI-NWP multi-model forecast blending (SIH PS 26081)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "xarray",
    "dask",
    "zarr",
    "gcsfs",
    "ecmwf-opendata",
    "imdlib",
    "cfgrib",
    "netcdf4",
    "xskillscore",
    "scipy",
    "pyarrow",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
]
dashboard-api = [
    "fastapi",
    "uvicorn[standard]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/weavr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# 3.12, not 3.11 (the project's minimum): numpy's own type stubs use 3.12-only
# syntax, and this setting only controls which stub/syntax rules mypy checks
# against, not a claim that project code needs 3.12.
python_version = "3.12"
ignore_missing_imports = true
