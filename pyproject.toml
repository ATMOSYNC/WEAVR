[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weavr"
version = "0.1.0"
description = "Hybrid AI-NWP multi-model forecast blending (SIH PS 26081)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "xarray",
    "dask",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
]

[tool.hatch.build.targets.wheel]
packages = ["src/weavr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
